# Local dev: hugo server prints and uses this URL.
# GitHub Actions overrides --baseURL when deploying (see .github/workflows/hugo.yml).
baseURL = 'http://localhost:1313/'
languageCode = 'en-us'
title = 'PLeW-NLG'

[params]
  description = 'Interactive exploration of human evaluation data across NLG tasks'

[markup.goldmark.renderer]
  unsafe = true

# Publish the self-contained guide at /user-guide.html (images are inlined).
[[module.mounts]]
  source = 'static'
  target = 'static'
[[module.mounts]]
  source = 'docs/user-guide-standalone.html'
  target = 'static/user-guide.html'
